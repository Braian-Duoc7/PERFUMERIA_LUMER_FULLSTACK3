spring:
  application:
    name: microservicio-ordenes
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

server:
  port: 8002
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.perfumeria: DEBUG
